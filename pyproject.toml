[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbam-unet"
version = "0.1.0"
description = "MR2-AttUNet: multi-resolution CBAM attention U-Net for supervised MRI motion artifact correction via k-space data synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "U.Y.G.M.K. Bandara" },
    { name = "W.M.V.S. Herath" },
    { name = "Maheshi B. Dissanayake" },
    { name = "S.C. Weerasinghe" },
]
keywords = [
    "MRI",
    "motion-artifact",
    "U-Net",
    "CBAM",
    "attention",
    "medical-imaging",
    "deep-learning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "tensorflow>=2.15",
    "keras>=3.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]

[project.urls]
"Source" = "https://github.com/your-org/cbam-unet-mri-motion-correction"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cbam_unet*"]

[tool.setuptools.package-dir]
"" = "src"
